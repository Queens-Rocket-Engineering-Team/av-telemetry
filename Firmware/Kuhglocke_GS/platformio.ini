[env:KUHGLOCKE]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv       ; Expanded app partitions, no SPIFFS
board_build.arduino.memory_type = qio_qspi    ; N16R2
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    -Wall -Wextra -Werror -Wno-implicit-fallthrough -fno-exceptions
    -I ../ctl-qlcp-lib/include
    -I ./wifi                                 ; QLCP socket transport (project-local; see wifi/)
build_src_filter =
    +<*>
    +<../../ctl-qlcp-lib/src>
    +<../wifi>
lib_deps =
    jgromes/RadioLib
    adafruit/Adafruit NeoPixel
    mikalhart/TinyGPSPlus
    luisllamasbinaburo/MedianFilterLib
    https://github.com/Kenneract/NAU7802_Arduino_2CH
    zinggjm/GxEPD2
lib_extra_dirs =
    ../../../av-libraries/                    ; aim_network -> aim_catalog.h
    ../lora_link/                             ; shared LoRa wire format (Comms <-> GS)
