[env:WAGGLE]
platform = ststm32
board = genericSTM32F103CB
board_build.mcu = stm32f103cbt6
framework = arduino
debug_tool = stlink
upload_protocol = stlink

monitor_speed = 38400

build_flags =
    -DHAL_CAN_MODULE_ENABLED
    ; Set HSE based on physical crystal
    -DHSE_VALUE=16000000U
    -Wall
    -Wextra
    -Werror
    ; Bundled littlefs (aim_flash_storage) has unused static helpers.
    -Wno-unused-function
    -fno-exceptions
    ; No-UCM configuration: uncomment to make Comms the sole TimeSync master.
    ; -DAIM_COMMS_TIME_MASTER

lib_deps =
    adafruit/Adafruit NeoPixel
    jgromes/RadioLib

; aim_flash_storage pulls in a nested littlefs dependency — deep+ resolves it.
lib_ldf_mode = deep+

lib_extra_dirs =
    ; Workspace av-libraries provides aim_network, aim_logger, aim_flash_storage.
    ../../../av-libraries/
    ../lora_link/                             ; shared LoRa wire format (Comms <-> GS)
